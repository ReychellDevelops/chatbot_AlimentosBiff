# render.yaml
services:
  - type: web
    name: chatbot-alimentosbiff
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /
    ports:
      - port: 10000
        protocol: http